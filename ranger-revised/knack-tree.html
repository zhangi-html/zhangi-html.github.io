<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranger Knacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Vollkorn:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --updated: #ffd23f; --updated-ink: #3b2c00;
  --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2356645b%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22/%3E%3C/svg%3E");
  --link-spell: #7a3fb0; --link-item: #99650f; --link-rule: #1c6db5; --link-beast: #16757b; --link-feat: #a8327a;
  --new: #7cd3ff; --new-ink: #06324a;
  --paper: #e1e3d4; --paper-2: #f3f3ea; --paper-3: #d2d5c2; --ink: #25332c; --ink-soft: #56645b;
  --rule: #b3b8a2; --locked: #8d9284; --danger: #b3261e; --gain: #237a3b; --focus: #1d5fa8;
  --reached: rgba(255, 255, 250, .55); --unreached: rgba(37, 51, 44, .07);
  --shadow: 0 1px 0 rgba(37, 51, 44, .18), 0 3px 10px -4px rgba(37, 51, 44, .35);
  --serif: "Vollkorn", "Iowan Old Style", Georgia, serif;
  --sans: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a3ad9f%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22/%3E%3C/svg%3E"); --link-spell: #cfa3f5; --link-item: #e7b75c; --link-rule: #7fbcf2; --link-beast: #72d3d8; --link-feat: #f39ccb; --paper: #1b221e; --paper-2: #252e28; --paper-3: #2f3933; --ink: #e2e6da; --ink-soft: #a3ad9f;
    --rule: #46524a; --locked: #7c8578; --danger: #ef6b61; --gain: #6fcf86; --focus: #7fb2ff;
    --reached: rgba(255, 255, 255, .05); --unreached: rgba(0, 0, 0, .28);
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a3ad9f%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22/%3E%3C/svg%3E"); --link-spell: #cfa3f5; --link-item: #e7b75c; --paper: #1b221e; --paper-2: #252e28; --paper-3: #2f3933; --ink: #e2e6da; --ink-soft: #a3ad9f;
  --rule: #46524a; --locked: #7c8578; --danger: #ef6b61; --gain: #6fcf86; --focus: #7fb2ff;
  --reached: rgba(255, 255, 255, .05); --unreached: rgba(0, 0, 0, .28);
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--sans); display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button { font: inherit; color: inherit; }
strong, b { font-weight: 700; }
strong em, em strong, b em, em b { font-weight: 700; font-style: italic; }
body { font-synthesis: weight style; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 18px 10px; border-bottom: 1px solid var(--rule); position: relative; z-index: 5; background: var(--paper); }
.bar h1 { font: 700 1.55rem/1 var(--serif); margin: 0 auto 0 0; }
.field { display: flex; align-items: center; gap: 8px; }
.field > span { color: var(--ink-soft); font-size: .95rem; }
.stepper { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper-2); }
.stepper button { width: 34px; border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; line-height: 1; }
.stepper button:hover { background: var(--paper-3); }
.stepper input { width: 42px; text-align: center; border: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); background: transparent; font: 700 1.05rem var(--sans); color: var(--ink); padding: 6px 0; }
.tally { font-size: .95rem; color: var(--ink-soft); white-space: nowrap; }
.tally b { font: 700 1.3rem var(--serif); color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.tally .n { display: inline-block; min-width: 1.1em; text-align: right; }
.tally .n + .n { text-align: left; }
.tally.over b { color: var(--danger); }
.group { display: flex; gap: 4px; }
.btn { border: 1px solid var(--rule); background: var(--paper-2); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: .93rem; }
.btn:hover:not(:disabled) { background: var(--paper-3); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { padding: 6px 8px; display: inline-flex; align-items: center; justify-content: center; }
.btn svg.i { width: 18px; height: 18px; }
.tally-group { align-items: center; gap: 10px; }
.tagrow { display: flex; align-items: center; gap: 8px; width: 100%; }
.tags { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 11px 3px 8px; background: transparent; cursor: pointer; font-size: .86rem; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip small { color: var(--ink-soft); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.chip[aria-pressed="true"] i { background: #fff; }
.chip[aria-pressed="true"] small { color: rgba(255,255,255,.8); }
#clearTags { flex: none; border-radius: 999px; padding: 3px 12px; font-size: .86rem; }
.notice { position: absolute; left: 12px; top: calc(100% + 8px); margin: 0; max-width: min(640px, calc(100% - 24px)); padding: 6px 12px; border-radius: 8px; background: var(--paper-2); border: 1.5px solid var(--danger); color: var(--danger); font-size: .92rem; box-shadow: var(--shadow); z-index: 6; }
.notice:empty { display: none; }

/* ---------- tree ---------- */
.main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
.scroller { overflow: auto; position: relative; min-height: 0; overscroll-behavior: contain; }
.canvas { position: relative; }
.heads { position: sticky; top: 0; z-index: 4; height: 34px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.pillar { position: absolute; top: 0; height: 34px; display: flex; align-items: center; transform: translateX(-50%); padding: 0 10px; font: 700 1.15rem/1 var(--serif); white-space: nowrap; color: var(--c); }
.pillar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--c); }
.territory { position: absolute; left: 0; top: 0; opacity: .2; filter: blur(16px); image-rendering: auto; pointer-events: none; }
.band { z-index: 0; }
.band.reached { background: transparent; }
.lanehead { position: absolute; top: 34px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: .84rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { position: relative; overflow: hidden; }
.sectioncol { position: absolute; top: 0; bottom: 0; background: var(--c); opacity: .06; border-radius: 0 0 12px 12px; }
.band { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule); }
.band.reached { background: var(--reached); }
.band.unreached { background: var(--unreached); }
.band.threshold { border-top: 2px solid var(--ink); }
.band-label { position: sticky; left: 0; display: inline-flex; align-items: baseline; gap: 5px; margin: 5px 0 0 8px; padding: 1px 10px 2px; z-index: 2; border-radius: 999px; background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--rule); }
.band-label span { font-size: .8rem; color: var(--ink-soft); }
.band-label strong { font: 700 1.1rem/1.2 var(--serif); }
.band.threshold .band-label { border-color: var(--ink); }
.band.unreached .band-label strong { color: var(--locked); font-weight: 500; }
.band.threshold .band-label::after { content: "next"; font-size: .75rem; color: var(--ink-soft); }
svg.lines { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke-width: 2.2; }
.edge.met { stroke: var(--c); }
.edge.open { stroke: var(--c); opacity: .6; stroke-dasharray: 6 5; }
.edge.locked { stroke: var(--locked); opacity: .5; stroke-dasharray: 3 5; }
.edge.preview { stroke: var(--gain); opacity: 1; stroke-dasharray: none; stroke-width: 3; }
.edge.preview-forget { stroke: var(--danger); opacity: 1; stroke-dasharray: none; stroke-width: 3; }

.node {
  position: absolute; display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  border-radius: 10px; cursor: pointer; border: 1.5px solid transparent;
  background: linear-gradient(var(--paper-2), var(--paper-2)) padding-box, linear-gradient(90deg, var(--c), var(--c2)) border-box;
  box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: background .15s, color .15s, opacity .15s;
}
.node > * { pointer-events: none; }
.node .nm { font-weight: 700; line-height: 1.12; font-size: .97rem; flex: 1; min-width: 0; }
.node .sub { display: block; font-weight: 400; font-size: .76rem; color: var(--ink-soft); }
.node .extra { display: flex; gap: 3px; align-items: center; }
.node .pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .75; }
.node .pip.on { background: currentColor; opacity: 1; }
.node .count { font: 700 .95rem var(--serif); }
.node .new { position: absolute; top: -10px; left: 10px; padding: 0 8px; border-radius: 999px; background: var(--new); color: var(--new-ink); font-size: .72rem; font-weight: 700; line-height: 1.55; letter-spacing: .02em; box-shadow: 0 0 0 2px var(--paper), 0 0 12px 2px color-mix(in srgb, var(--new) 70%, transparent); }
.node .skill, .editor .node-demo .skill { position: absolute; bottom: -10px; left: 10px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink); border: 1px solid var(--ink-soft); font-size: .7rem; font-weight: 700; line-height: 1.5; font-style: normal;
  box-shadow: 0 0 0 2px var(--paper); pointer-events: none; }
.node.learned .skill { background: #fff; color: #1d2621; border-color: #fff; }
.node.locked .skill { color: var(--ink-soft); border-style: dashed; }
.node .new.status-updated, .editor .node-demo .new.status-updated { background: var(--updated); color: var(--updated-ink); box-shadow: 0 0 0 2px var(--paper), 0 0 12px 2px color-mix(in srgb, var(--updated) 70%, transparent); }
.newflag.status-updated, .editor .item .newdot.status-updated { background: var(--updated) !important; color: var(--updated-ink) !important; }
.chip.newchip.status-updated i { background: var(--updated); }
.chip.newchip.status-updated[aria-pressed="true"] { background: var(--updated); border-color: var(--updated); color: var(--updated-ink); }
.chip.newchip.status-updated[aria-pressed="true"] i { background: var(--updated-ink); }
.panel .newflag, .editor .newflag { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 0 8px; border-radius: 999px; background: var(--new); color: var(--new-ink); font: 700 .75rem/1.6 var(--sans); }
.chip.newchip i { background: var(--new); }
.chip.newchip[aria-pressed="true"] { background: var(--new); border-color: var(--new); color: var(--new-ink); }
.chip.newchip[aria-pressed="true"] i { background: var(--new-ink); }
.node.learned { background: linear-gradient(90deg, var(--c), var(--c2)) border-box; color: #fff; }
.node.learned .sub { color: rgba(255,255,255,.82); }
.node.reachable { background: linear-gradient(color-mix(in srgb, var(--paper-2) 70%, var(--paper)), color-mix(in srgb, var(--paper-2) 70%, var(--paper))) padding-box, linear-gradient(90deg, color-mix(in srgb, var(--c) 50%, transparent), color-mix(in srgb, var(--c2) 50%, transparent)) border-box; box-shadow: none; }
.node.locked { border: 1.5px dashed var(--locked); background: transparent; box-shadow: none; color: var(--ink-soft); }
.node.preview { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--gain); }
.node.preview-forget { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--danger); }
.node.invalid { outline: 2.5px solid var(--danger); outline-offset: 2px; }
.node.dim { opacity: .25; }

/* hover hint: which click does what, and what it costs */
.acts { position: absolute; z-index: 6; display: none; gap: 4px; transform: translate(-100%, calc(-100% + 3px)); pointer-events: none; }
.acts.on { display: flex; }
.act { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px 2px 5px; border-radius: 999px; background: var(--paper-2); border: 1.5px solid currentColor; font-weight: 700; font-size: .85rem; box-shadow: var(--shadow); }
.act.learn { color: var(--gain); }
.act.forget { color: var(--danger); }
.act.no { color: var(--locked); }
.act.no b { text-decoration: line-through; }
.act b, .panel-actions b { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- panel ---------- */
.panel { border-left: 1px solid var(--rule); overflow: auto; padding: 22px 24px 28px; background: var(--paper-2); }
.panel .empty { color: var(--ink-soft); }
.panel .empty h2 { font: 600 1.3rem var(--serif); color: var(--ink); margin: 0 0 12px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: .92rem; margin: 0; }
.legend dt { display: flex; justify-content: center; }
.legend dd { margin: 0; }
.legend svg.line { width: 34px; height: 8px; }
.legend .sw { width: 30px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-soft); }
.panel h2.title { font: 700 1.7rem/1.1 var(--serif); margin: 0 0 4px; }
.where { display: block; color: var(--c); font-weight: 700; font-size: .9rem; margin-bottom: 10px; }
.ptags { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 14px; }
.ptags .chip { font-size: .8rem; padding: 2px 9px 2px 7px; cursor: default; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 16px; font-size: .93rem; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; }
.klinks { display: flex; flex-wrap: wrap; gap: 6px; }
.klink { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 8px; cursor: pointer; font: 700 .88rem/1.3 var(--sans); color: var(--ink);
  border: 1.5px solid transparent; background: linear-gradient(var(--paper), var(--paper)) padding-box, linear-gradient(90deg, var(--c), var(--c2)) border-box; box-shadow: var(--shadow); transition: transform .12s, background .12s; }
.klink svg.i { width: 14px; height: 14px; color: var(--c); }
.klink:hover, .klink:focus-visible { transform: translateY(-1px); background: linear-gradient(color-mix(in srgb, var(--c) 14%, var(--paper)), color-mix(in srgb, var(--c2) 14%, var(--paper))) padding-box, linear-gradient(90deg, var(--c), var(--c2)) border-box; }
.klink.learned { color: #fff; background: linear-gradient(90deg, var(--c), var(--c2)) border-box; }
.klink.learned svg.i { color: #fff; }
.node.spot { outline: 3px solid var(--ink); outline-offset: 3px; z-index: 3; }
.facts dd { align-self: center; }
.rules p { margin: 0 0 .8em; }
.rules ul { margin: 0 0 .8em; padding-left: 1.2em; }
.rules li { margin-bottom: .35em; }
.rules table { border-collapse: collapse; margin: 4px 0 14px; font-size: .92rem; }
.rules th, .rules td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid var(--rule); }
.rules p.prereq { margin: 0 0 .6em; }
li > p.li-p { margin: .4em 0 0; }
.tbl-name { margin: 10px 0 2px !important; font-weight: 700; color: var(--ink-soft); }
.spellcard .tbl-name { color: inherit; opacity: .7; }
.spellcard table { border-collapse: collapse; width: 100%; margin: 2px 0 10px; font-size: .92rem; }
.spellcard th { text-align: left; font-weight: 700; padding: 3px 10px 3px 4px; vertical-align: bottom; }
.spellcard td { text-align: left; padding: 3px 10px 3px 4px; }
.spellcard tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--sc-note) 45%, transparent); }
.clarify { margin: 16px 0 0; padding: 12px 14px 4px; border-radius: 10px; background: color-mix(in srgb, var(--c, var(--ink)) 8%, var(--paper-2)); border: 1px solid color-mix(in srgb, var(--c, var(--ink)) 35%, transparent); border-left-width: 4px; font-size: .95rem; }
.oldrules { margin: 22px 0 0; padding-top: 12px; border-top: 1px dashed var(--rule); }
.oldrules h3 { font: 600 1rem/1.2 var(--serif); margin: 0 0 8px; color: var(--ink-soft); }
.oldrules .rules { color: var(--ink-soft); }
.clarify h3 { font: 600 1rem/1.2 var(--serif); margin: 0 0 6px; color: var(--c, var(--ink)); }
.clarify p { margin: 0 0 .7em; }
.clarify ul { margin: 0 0 .7em; padding-left: 1.2em; }
.status { font-size: .93rem; padding: 10px 12px; border-radius: 8px; background: var(--paper-3); margin: 18px 0 0; }
.status.bad { color: var(--danger); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.panel-actions .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-weight: 700; }
.panel-actions .learn { color: var(--gain); border-color: currentColor; }
.panel-actions .forget { color: var(--danger); border-color: currentColor; }
.close { display: none; }

.drop { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: color-mix(in srgb, var(--paper) 85%, transparent); font: 600 1.4rem var(--serif); border: 3px dashed var(--ink); }
.drop.on { display: grid; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: .93rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90vw; }
.toast.on { opacity: 1; }

/* spell links + card */
.spell { font: inherit; border: 0; padding: 0; background: none; color: var(--ref, var(--ink)); font-style: italic; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }
.spell .ref-ic { display: inline-block; width: .95em; height: .95em; margin-right: .2em; vertical-align: -.13em; font-style: normal; }
.spell .ref-ic svg { width: 100%; height: 100%; display: block; }
.spell.ref-spell { --ref: var(--link-spell); }
.spell.ref-item { --ref: var(--link-item); text-decoration-style: dashed; }
.spell.ref-rule { --ref: var(--link-rule); text-decoration-style: solid; text-decoration-thickness: 1px; }
.spell.ref-bestiary { --ref: var(--link-beast); text-decoration-style: double; }
.spell.ref-feat { --ref: var(--link-feat); text-decoration-style: dotted; text-decoration-thickness: 2px; }
.spell.missing { --ref: var(--danger); text-decoration: underline wavy; cursor: default; }
.spellcard .spell.ref-spell { --ref: #6b2fa0; } .spellcard .spell.ref-item { --ref: #8a5a00; } .spellcard .spell.ref-rule { --ref: #175f9f; } .spellcard .spell.ref-bestiary { --ref: #13676c; } .spellcard .spell.ref-feat { --ref: #9a2a6c; }
.spellcard {
  --sc-bg: #fdf1dc; --sc-ink: #2b2118; --sc-title: #822000; --sc-edge: #e69a28; --sc-note: #dfb997;
  position: fixed; z-index: 40; width: min(400px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto;
  background: var(--sc-bg); color: var(--sc-ink); border-top: 5px solid var(--sc-edge); border-bottom: 5px solid var(--sc-edge);
  padding: 10px 16px 12px; box-shadow: 0 10px 34px -10px rgba(0,0,0,.5); font-size: .95rem; line-height: 1.4; display: none; pointer-events: none;
}
.spellcard.on { display: block; }
.spellcard.pinned { pointer-events: auto; }

<script type="application/json" id="knack-data">{"title": "Ranger Knacks", "knacksKnown": [1, 3, 4, 5, 5, 7, 8, 8, 10, 10, 11, 11, 11, 13, 14, 14, 14, 14, 14, 14], "pillars": [{"name": "Combat", "color": "#a3182f"}, {"name": "Social", "color": "#3a44a6"}, {"name": "Exploration", "color": "#2e8a3c"}], "tags": [{"name": "Nature", "color": "#4f7a34"}, {"name": "Environmental Adaptation", "color": "#3a6f94"}, {"name": "Skills and Proficiencies", "color": "#8a6d1f"}, {"name": "Hunter's Mark", "color": "#a33d2a"}, {"name": "Critical Hits", "color": "#c2572b"}, {"name": "Mounted Combat", "color": "#7a5536"}, {"name": "Spells", "color": "#5d4aa0"}, {"name": "Healing", "color": "#23866a"}, {"name": "Stealth", "color": "#4b5170"}, {"name": "Tracking", "color": "#8c4f7c"}, {"name": "Mobility", "color": "#2a7c93"}, {"name": "Herbalism", "color": "#62852a"}, {"name": "Woodcarving", "color": "#96683a"}, {"name": "Trapper", "color": "#6b6a58"}], "knacks": [{"id": "deft-explorer-1", "name": "Deft Explorer I", "pillars": ["Exploration", "Social"], "level": 1, "prereqs": [], "tags": ["Skills and Proficiencies"], "text": ["***Expertise.*** Choose one of your skill proficiencies with which you lack Expertise. You gain Expertise in that skill.", "***Languages.*** You know one language of your choice."]}, {"id": "deft-explorer-2", "name": "Deft Explorer II", "pillars": ["Exploration", "Social"], "level": 6, "prereqs": ["deft-explorer-1"], "tags": ["Skills and Proficiencies"], "text": ["***Expertise.*** Choose another of your skill proficiencies with which you lack Expertise. You gain Expertise in that skill.", "***Languages.*** You know one additional language of your choice."]}, {"id": "deft-explorer-3", "name": "Deft Explorer III", "pillars": ["Exploration", "Social"], "level": 9, "prereqs": ["deft-explorer-2"], "tags": ["Skills and Proficiencies"], "text": ["***Expertise.*** Choose another of your skill proficiencies with which you lack Expertise. You gain Expertise in that skill.", "***Languages.*** You know one additional language of your choice."]}, {"id": "strider-1", "name": "Strider I", "pillars": ["Exploration"], "level": 1, "prereqs": [], "tags": ["Mobility", "Nature"], "text": ["Your movement is unaffected by Difficult Terrain imposed by natural environments, such as undergrowth, snow, or swamp. You also can't become lost so long as you can see the night sky.", "Finally, the Travel Pace of you and up to 10 creatures who travel with you is unaffected by natural Difficult Terrain."]}, {"id": "strider-2", "name": "Strider II", "pillars": ["Combat"], "level": 3, "prereqs": ["strider-1"], "tags": ["Mobility"], "text": ["Once in your sights, you pursue your enemies relentlessly. You can take the Dash action as a Bonus Action on your turn."]}, {"id": "strider-3", "name": "Strider III", "pillars": ["Combat", "Exploration"], "level": 6, "prereqs": ["strider-2"], "tags": ["Mobility"], "text": ["You can surmount almost any obstacle that would block your path. Your Speed increases by 10 feet, your movement is unaffected by Difficult Terrain, and spells and other magical effects can't reduce your Speed."]}, {"id": "strider-4", "name": "Strider IV", "pillars": ["Combat"], "level": 14, "prereqs": ["strider-3"], "tags": ["Mobility", "Spells"], "text": ["You move through the world unhindered by even the most powerful magic and restraints. You are always under the effects of the [[Freedom of Movement]] spell unless you have the Unconscious condition."]}, {"id": "naturalist-1", "name": "Naturalist I", "pillars": ["Exploration"], "level": 1, "prereqs": [], "tags": ["Nature", "Skills and Proficiencies"], "text": ["You are an intuitive student of the wilderness. Whenever you would make an Intelligence (Nature) check in the wilderness, you can choose to make a Wisdom (Nature) check instead.", "Also, you can make Wisdom (Nature) checks as a Bonus Action to recall knowledge about one beast or plant you see."]}, {"id": "naturalist-2", "name": "Naturalist II", "pillars": ["Exploration"], "level": 6, "prereqs": ["naturalist-1"], "tags": ["Nature", "Skills and Proficiencies"], "text": ["At the end of a Long Rest, you can attune to your surrounding environment. Examples include, but are not limited to: arctic, coast, desert, forest, grassland, mountain, or swamp. While in your attuned environment, you gain the following benefits:", "- You have advantage on Wisdom (Nature) checks related to the local plants, animals, ecosystem, and weather.\n- You find twice as much food when foraging or hunting.\n- You cannot gain the Surprised condition unless you have the Incapacitated condition.\n- You have Advantage on your [[rule:Initiative]] rolls so long as you are not surprised or incapacitated."]}, {"id": "alpine-adept", "name": "Alpine Adept", "pillars": ["Exploration", "Combat"], "group": "Movement Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation", "Mobility"], "text": ["You are amazingly surefooted. You gain a 30-foot Climb Speed, and you can take a Reaction when you fall to reduce any damage you take from the fall by an amount equal to your Ranger level.", "If you already have a Climb Speed it increases by 10 feet."]}, {"id": "aquatic-adept", "name": "Aquatic Adept", "pillars": ["Exploration", "Combat"], "group": "Movement Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation", "Mobility"], "text": ["You can swim through the water like a native creature of the sea. You gain a 30-foot Swim Speed, and while you are underwater, you can hold your breath for up to 1 hour. If you already have a Swim Speed it increases by 10 feet."]}, {"id": "underground-adept", "name": "Underground Adept", "pillars": ["Exploration", "Combat"], "group": "Movement Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation"], "text": ["You are especially skilled at navigating the winding tunnels under the earth. You gain Darkvision out to a range of 60 feet. If you already have Darkvision its range increases by 30 feet.", "As an Action you can close your eyes to gain Tremorsense out to a 60-foot radius. In that radius, you can sense anything touching the ground. This special sense lasts for 1 minute, or until you open your eyes. Once you use this Action you must finish a Short or Long Rest before you can use it again."]}, {"id": "arctic-adept", "name": "Arctic Adept", "pillars": ["Exploration", "Combat"], "group": "Climate Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation"], "text": ["You have adapted to the frozen tundra. You gain Resistance to Cold damage. Also, you and up to 10 creatures who travel with you have Advantage on any saving throws they make to resist the hostile effects of arctic environments."]}, {"id": "desert-adept", "name": "Desert Adept", "pillars": ["Exploration", "Combat"], "group": "Climate Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation"], "text": ["You have adapted to scorching deserts. You gain Resistance to Fire damage. Also, you and up to 10 creatures who travel with you have Advantage on any saving throws they make to resist the hostile effects of desert environments."]}, {"id": "jungle-adept", "name": "Jungle Adept", "pillars": ["Exploration", "Combat"], "group": "Climate Adepts", "level": 1, "prereqs": [], "tags": ["Environmental Adaptation"], "text": ["You have adapted to the jungles. You gain Resistance to Poison damage. Also, you and up to 10 creatures who travel with you have Advantage on any saving throws they make to resist the hostile effects of jungle environments."]}, {"id": "planar-adept", "name": "Planar Adept", "pillars": ["Exploration", "Combat"], "group": "Climate Adepts", "level": 9, "prereqs": [], "maxRanks": 8, "tags": ["Environmental Adaptation"], "text": ["You have adapted to life on one of the great planes of the multiverse. Choose one plane from the table below (or the corresponding plane in your setting). You gain Resistance to the corresponding damage type. Also, you and up to ten creatures who travel with you, have Advantage on saving throws to resist the hostile effects of that plane.", "[[table]]", "You can learn this Knack more than once, but you must choose a different plane of existence each time you do so."], "table": [["Plane", "Damage"], ["Astral Sea", "Radiant"], ["Feywild", "Psychic"], ["Mechanus", "Force"], ["Shadowfell", "Necrotic"], ["Air", "Thunder"], ["Earth", "Acid"], ["Fire", "Fire"], ["Water", "Cold"]]}, {"id": "slayer-1", "name": "Slayer I", "pillars": ["Combat"], "level": 3, "prereqs": [], "tags": ["Hunter's Mark"], "text": ["To mark a creature with your [[Hunter's Mark]], you must cast [[Hunter's Mark]] targeting it, or—if the previous target of an ongoing [[Hunter's Mark]] dropped to 0 Hit Points before the spell ended—move the mark to the creature.", "When you hit a creature with a weapon attack you can mark a creature with your Hunter's Mark as part of the attack, applying your Hunter's Mark damage bonus and other benefits to the damage roll."]}, {"id": "slayer-2", "name": "Slayer II", "pillars": ["Combat"], "level": 6, "prereqs": ["slayer-1"], "tags": ["Hunter's Mark", "Tracking"], "text": ["Your tracking abilities have become supernaturally accurate. You can mark a creature with your [[Hunter's Mark]] by studying signs of its passing, such as tracks, that were left within 24 hours.", "Moreover, whenever you make a Wisdom (Perception) or a Wisdom (Survival) check to locate or track the creature with your Hunter's Mark, you can treat a roll of 7 or lower on the d20 as an 8."]}, {"id": "slayer-3", "name": "Slayer III", "pillars": ["Combat"], "level": 14, "prereqs": ["slayer-2"], "tags": ["Hunter's Mark"], "text": ["When you hit a creature marked by your [[Hunter's Mark]] with a weapon attack, you can force it to make a Constitution saving throw against your spell save DC. On a failed save, it has the Blinded, Dazed, Deafened, or Restrained condition (your choice) until the start of your next turn. You can only use this feature once per turn."]}, {"id": "favored-foe", "name": "Favored Foe", "pillars": ["Exploration"], "level": 3, "prereqs": [], "maxRanks": null, "tags": ["Tracking", "Skills and Proficiencies"], "text": ["You are especially adept at studying, tracking, and hunting a specific type of enemy. Choose one creature type, two races of humanoid (such as gnolls and orcs), or one organization (like a thieves' guild or an evil cult) as your Favored Foe.", "Whenever you make a Wisdom check to hunt or track, or an Intelligence check to recall knowledge about a Favored Foe, you can treat a roll of 9 or lower on the d20 as a 10.", "You can choose to learn this Knack more than once, but you must choose a new Favored Foe each time you do so."]}, {"id": "fell-handed-1", "name": "Fell-Handed I", "pillars": ["Combat"], "level": 6, "prereqs": [], "tags": ["Critical Hits"], "text": ["When you score a Critical Hit with a weapon attack against a creature, you have Advantage on the next attack you make against that creature before the end of your next turn."]}, {"id": "fell-handed-2", "name": "Fell-Handed II", "pillars": ["Combat"], "level": 9, "prereqs": ["fell-handed-1"], "tags": ["Critical Hits"], "text": ["When you score a Critical Hit against a creature, your Critical Hit range for attack rolls against that creature expands by 1.", "For example, if you score a critical hit against a creature for the first time, you then score a critical hit on a roll of 19 or 20 when you make an attack roll against it, and so on."]}, {"id": "stalker-1", "name": "Stalker I", "pillars": ["Exploration"], "level": 1, "prereqs": [], "tags": ["Stealth"], "text": ["You are a master at remaining undetected in the wilderness. You have Advantage on Dexterity (Stealth) checks you make to hide while you are in natural environments."]}, {"id": "stalker-2", "name": "Stalker II", "pillars": ["Combat"], "level": 3, "prereqs": ["stalker-1"], "tags": ["Stealth"], "text": ["You have learned to hunt your prey while remaining unseen. You can take the Hide action as a Bonus Action on your turn."]}, {"id": "stalker-3", "name": "Stalker III", "pillars": ["Exploration"], "level": 9, "prereqs": ["stalker-2"], "tags": ["Stealth", "Tracking", "Spells"], "text": ["You cannot be tracked, even by magic. You are always under the effects of the [[Nondetection]] spell, and you can't be tracked by divination magic or magical means unless you wish to be."]}, {"id": "stalker-4", "name": "Stalker IV", "pillars": ["Combat"], "level": 14, "prereqs": ["stalker-3"], "tags": ["Stealth"], "text": ["You can ward yourself to briefly disappear from sight. When you take the Hide action, you have the Invisible condition until the start of your next turn. This ends early immediately after you make an attack roll, deal damage, or cast a spell."]}, {"id": "trapper", "name": "Trapper", "pillars": ["Combat"], "level": 1, "prereqs": [], "tags": ["Trapper"], "text": ["You can construct natural traps. Over the course of 2 hours, which can be during a Short or Long Rest, you can use a knife, natural materials, and expend 10 feet of rope to craft an improvised Trap, which lasts until the end of your next Long Rest.", "As an Action, you can set one of these Traps in an adjacent unoccupied 5-foot space. The first Large or smaller creature to move into that space must succeed on a Dexterity saving throw against your spell save DC or it has the Restrained condition.", "The target or a creature within reach of it can take an Action to make a Strength (Athletics) check against your spell save DC, ending the condition on it on a success.", "As an Action (separate from setting the Trap), you can hide the Trap. If hidden, a successful Intelligence (Investigation) against your spell save DC is required to detect the Trap."]}, {"id": "survivor-1", "name": "Survivor I", "pillars": ["Combat"], "level": 6, "prereqs": [], "tags": ["Healing"], "text": ["As a Bonus Action, you can expend one of your Hit Point Dice, roll the die, and regain a number of Hit Points equal to the roll. If you do so while in combat, you roll the die with Disadvantage."]}, {"id": "survivor-2", "name": "Survivor II", "pillars": ["Combat"], "level": 9, "prereqs": ["survivor-1"], "tags": ["Healing"], "text": ["Your body can rapidly recover from injury. When you expend a Hit Die to regain Hit Points, you regain additional Hit Points equal to your Wisdom modifier (minimum of 1 Hit Point)."]}, {"id": "survivor-3", "name": "Survivor III", "pillars": ["Combat"], "level": 14, "prereqs": ["survivor-2"], "tags": ["Healing"], "text": ["When you make a Death Saving Throw, you add your Wisdom modifier to the roll (minimum of +1). If the result of your roll is 20 or higher, it is as if you had rolled a 20 on the d20."]}, {"id": "herbalist-1", "name": "Herbalist I", "pillars": ["Combat"], "level": 1, "prereqs": [], "tags": ["Herbalism", "Healing", "Skills and Proficiencies"], "text": ["You have an extensive knowledge of plants and their healing properties. You gain proficiency with Herbalism Kits, and you automatically succeed on your Wisdom (Medicine) checks to stabilize creatures at 0 Hit Points if you use an Herbalism Kit."]}, {"id": "herbalist-2", "name": "Herbalist II", "pillars": ["Combat"], "level": 3, "prereqs": ["herbalist-1"], "tags": ["Herbalism", "Healing"], "text": ["You have learned to use natural plants and herbs to create healing salves. Over the course of a Long Rest, you can spend 2 hours using an Herbalism Kit to create an improvised [[item:Potion of Healing]]. These Potions of Healing retain their potency until the end of your next Long Rest, at which point they become inert."]}, {"id": "herbalist-3", "name": "Herbalist III", "pillars": ["Combat"], "level": 6, "prereqs": ["herbalist-2"], "tags": ["Herbalism", "Healing"], "text": ["When you use your Herbalism Kit to craft Potions of Healing during a long rest, you craft a number of improvised [[item:Potion of Healing|Potions of Healing]] equal to 1 + your Wisdom modifier (minimum of 2)."]}, {"id": "natural-regeneration", "name": "Natural Regeneration", "pillars": ["Combat"], "level": 3, "prereqs": [], "tags": ["Spells"], "text": ["When you finish a Short Rest, you can choose expended spell slots to recover. The spell slots can have a combined level equal to no more than your Wisdom modifier (minimum 1).", "Once you use this feature, you can't do so again until you finish a Long Rest."]}, {"id": "wild-insight-1", "name": "Wild Insight I", "pillars": ["Exploration"], "group": "Wild Insight", "level": 1, "prereqs": [], "tags": ["Nature"], "text": ["You have a special insight into the mannerisms and sounds of wild animals. You can communicate with beasts as if you were always under the effect of a [[Speak with Animals]] spell."]}, {"id": "wild-insight-2", "name": "Wild Insight II", "pillars": ["Exploration"], "group": "Wild Insight", "level": 6, "prereqs": [], "tags": ["Nature", "Spells"], "text": ["You always have the [[Beast Sense]] spell prepared, and you can cast it as a Ritual."]}, {"id": "wild-insight-3", "name": "Wild Insight III", "pillars": ["Exploration"], "group": "Wild Insight", "level": 9, "prereqs": [], "tags": ["Nature", "Spells"], "text": ["You always have the [[Speak with Plants]] spell prepared, and you can cast it as a Ritual, even though it doesn't have the Ritual tag."]}, {"id": "wild-insight-4", "name": "Wild Insight IV", "pillars": ["Exploration"], "group": "Wild Insight", "level": 14, "prereqs": [], "tags": ["Nature", "Spells", "Tracking"], "text": ["You always have the [[Locate Creature]] spell prepared, and you can cast it as a Ritual, even though it doesn't have the Ritual tag."]}, {"id": "wild-insight-5", "name": "Wild Insight V", "pillars": ["Exploration"], "group": "Wild Insight", "level": 17, "prereqs": [], "tags": ["Nature", "Spells"], "text": ["You always have the [[Commune with Nature]] spell prepared, and you can cast it as a Ritual."]}, {"id": "nature-spirit-1", "name": "Nature Spirit I", "pillars": ["Combat"], "level": 3, "prereqs": ["wild-insight-1"], "tags": ["Nature", "Spells"], "text": ["You have bound yourself with a minor nature spirit. You learn the [[Find Familiar]] spell. It is a Ranger spell for you and it is always prepared, but it does not count against the number of spells you prepare each day. When you cast this spell your summoned Familiar is always a Fey creature."]}, {"id": "nature-spirit-2", "name": "Nature Spirit II", "pillars": ["Combat"], "level": 9, "prereqs": ["nature-spirit-1"], "tags": ["Nature", "Spells"], "text": ["The power of your Fey spirit grows. When you cast [[Find Familiar]], it can take the form of a Beast of CR 1/2 or lower."]}, {"id": "rider-1", "name": "Rider I", "pillars": ["Combat"], "level": 1, "prereqs": [], "tags": ["Mounted Combat", "Skills and Proficiencies"], "text": ["Whenever you make a Wisdom (Animal Handling) check to control, train, or tame a mount, you can treat a roll of 7 or lower on a d20 as an 8. Also, dismounting from a trained mount only costs you 5 feet of your movement."]}, {"id": "rider-2", "name": "Rider II", "pillars": ["Combat"], "level": 3, "prereqs": ["rider-1"], "tags": ["Mounted Combat"], "text": ["You gain the Mounted Warrior Fighting Style, and you can ride trained mounts that are equal to you in size or larger.", "If you already know the Mounted Warrior Fighting Style you learn another Ranger Fighting Style of your choice."]}, {"id": "rider-3", "name": "Rider III", "pillars": ["Combat"], "level": 6, "prereqs": ["rider-2"], "tags": ["Mounted Combat"], "text": ["You are a master of mounted combat. When you are riding mount and it is hit by an attack, you can take a Reaction to become the target of that attack instead. Also, if your mount is forced to make a saving throw while you are riding it, you can take a Reaction to grant it Advantage on its roll."]}, {"id": "hedge-knight-1", "name": "Hedge Knight I", "pillars": ["Combat"], "level": 1, "prereqs": [], "tags": ["Skills and Proficiencies"], "text": ["Though you live in the wilds you still have some military training. You gain training in Heavy armor."], "group": "Hedge Knight"}, {"id": "hedge-knight-2", "name": "Hedge Knight II", "pillars": ["Social"], "level": 3, "prereqs": ["hedge-knight-1"], "tags": ["Skills and Proficiencies"], "text": ["Though you are a wild wanderer you understand chivalry and politics. Whenever you make an Intelligence (History) or Charisma (Persuasion) check, you can use Wisdom in place of Intelligence or Charisma, respectively."], "group": "Hedge Knight"}, {"id": "woodsman-1", "name": "Woodsman I", "pillars": ["Exploration"], "level": 1, "prereqs": [], "tags": ["Woodcarving", "Skills and Proficiencies"], "text": ["You are familiar with forests, trees, and raw timber. You gain proficiency with Woodcarver's Tools, and you have Advantage on ability checks to identify and construct things from wood.", "Also, at the end of each Long Rest, you can use Woodcarver's Tools and raw timber to craft a number of improvised Arrows, Bolts, Clubs, Javelins, and Quarterstaffs equal to your Proficiency Bonus, which last until the end of your next Long Rest."]}, {"id": "woodsman-2", "name": "Woodsman II", "pillars": ["Exploration"], "level": 3, "prereqs": ["woodsman-1"], "tags": ["Woodcarving", "Critical Hits"], "text": ["You can easily see the strengths and weak points of wooden objects and creatures. You gain the following benefits:", "- You gain proficiency with Carpenter's Tools. Anything you construct from wood has twice as many Hit Points.\n- If you hit a tree, raw timber, or a wooden structure with a melee weapon attack, it is an automatic Critical Hit.\n- If you hit a plant or wood construct with a melee weapon attack, you score a Critical Hit on a roll of 18 through 20."]}], "spells": [{"name": "Speak with Animals", "source": "PHB'24", "level": 1, "school": "Divination", "castingTime": "Action", "ritual": true, "range": "Self", "components": {"v": true, "s": true}, "duration": "10 minutes", "concentration": false, "description": ["For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action's skill options with them.", "Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day."]}, {"name": "Hunter's Mark", "source": "PHB'24", "level": 1, "school": "Divination", "castingTime": "Bonus Action", "ritual": false, "range": "90 feet", "components": {"v": true}, "duration": "1 hour", "concentration": true, "description": ["You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it.", "If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range."], "higherLevels": "Your Concentration can last longer with a spell slot of level 3–4 (up to 8 hours) or 5+ (up to 24 hours)."}, {"name": "Find Familiar", "source": "PHB'24", "level": 1, "school": "Conjuration", "castingTime": "1 hour", "ritual": true, "range": "10 feet", "components": {"v": true, "s": true, "m": "burning incense worth 10+ GP, which the spell consumes"}, "duration": "Instantaneous", "concentration": false, "description": ["You gain the service of a familiar, a spirit that takes an animal form you choose: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel, or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it always obeys your commands.", "***Telepathic Connection.*** While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has.", "***Combat.*** The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal.", "***Disappearance of the Familiar.*** When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying.", "***One Familiar Only.*** You can't have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.", "***Touch Spells.*** When you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell."]}, {"name": "Beast Sense", "source": "PHB'24", "level": 2, "school": "Divination", "castingTime": "Action", "ritual": true, "range": "Touch", "components": {"s": true}, "duration": "1 hour", "concentration": true, "description": ["You touch a willing Beast. For the duration, you can perceive through the Beast's senses as well as your own. When perceiving through the Beast's senses, you benefit from any special senses it has."]}, {"name": "Speak with Plants", "source": "PHB'24", "level": 3, "school": "Transmutation", "castingTime": "Action", "ritual": false, "range": "Self", "area": "30-foot Emanation", "components": {"v": true, "s": true}, "duration": "10 minutes", "concentration": false, "description": ["You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances.", "You can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration.", "The spell doesn't enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you.", "If a Plant creature is in the area, you can communicate with it as if you shared a common language."]}, {"name": "Nondetection", "source": "PHB'24", "level": 3, "school": "Abjuration", "castingTime": "Action", "ritual": false, "range": "Touch", "components": {"v": true, "s": true, "m": "a pinch of diamond dust worth 25+ GP, which the spell consumes"}, "duration": "8 hours", "concentration": false, "description": ["For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any Divination spell or perceived through magical scrying sensors."]}, {"name": "Freedom of Movement", "source": "PHB'24", "level": 4, "school": "Abjuration", "castingTime": "Action", "ritual": false, "range": "Touch", "components": {"v": true, "s": true, "m": "a leather strap"}, "duration": "1 hour", "concentration": false, "description": ["You touch a willing creature. For the duration, the target's movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target's Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed.", "In addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it."], "higherLevels": "You can target one additional creature for each spell slot level above 4."}, {"name": "Locate Creature", "source": "PHB'24", "level": 4, "school": "Divination", "castingTime": "Action", "ritual": false, "range": "Self", "components": {"v": true, "s": true, "m": "fur from a bloodhound"}, "duration": "1 hour", "concentration": true, "description": ["Describe or name a creature that is familiar to you. You sense the direction to the creature's location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement.", "The spell can locate a specific creature known to you or the nearest creature of a specific kind (such as a human or a unicorn) if you have seen such a creature up close—within 30 feet—at least once. If the creature you described or named is in a different form, such as under the effects of a Flesh to Stone or Polymorph spell, this spell doesn't locate the creature.", "This spell can't locate a creature if any thickness of lead blocks a direct path between you and the creature."]}, {"name": "Commune with Nature", "source": "PHB'24", "level": 5, "school": "Divination", "castingTime": "1 minute", "ritual": true, "range": "Self", "components": {"v": true, "s": true}, "duration": "Instantaneous", "concentration": false, "description": ["You commune with nature spirits and gain knowledge of the surrounding area. In the outdoors, the spell gives you knowledge of the area within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in castles and settlements.", "Choose three of the following facts; you learn those facts as they pertain to the spell's area:", "- Locations of settlements\n- Locations of portals to other planes of existence\n- Location of one Challenge Rating 10+ creature (DM's choice) that is a Celestial, an Elemental, a Fey, a Fiend, or an Undead\n- The most prevalent kind of plant, mineral, or Beast (you choose which to learn)\n- Locations of bodies of water", "For example, you could determine the location of a powerful Undead creature in the area, the location of sources of safe drinking water, and the location of any nearby towns."]}], "items": [{"name": "Potion of Healing", "source": "DMG'24", "type": "Potion", "rarity": "Common", "cost": {"gp": 50}, "description": ["This potion is a magic item. As a Bonus Action, you can drink it or administer it to another creature within 5 feet of yourself. The creature that drinks the magical red fluid in this vial regains 2d4 + 2 Hit Points. The potion's red liquid glimmers when agitated."]}], "rules": [{"name": "Initiative", "source": "PHB'24", "subtitle": "Core Rule", "text": ["Initiative determines the order of turns during combat. The combat rules in chapter 1 explain how to roll Initiative.", "Sometimes a DM might have combatants use their Initiative scores instead of rolling Initiative. Your Initiative score equals 10 plus your Dexterity modifier. If you have Advantage on Initiative rolls, increase your Initiative score by 5. If you have Disadvantage on those rolls, decrease that score by 5."]}], "bestiary": [{"name": "Battle Familiar", "source": "AU", "size": "Medium", "type": "Celestial, Fey, or Fiend", "alignment": {"law": "Neutral", "moral": "Neutral"}, "ac": "11 + the spell's level + 2 (Brute only)", "init": "+3 (13)", "hp": "30 (Brute only) or 20 (Flyer or Stalker only) + 5 for each spell level above 2", "speed": "40 ft., Fly 30 ft. (hover; Flyer only), Swim 30 ft.", "pb": 2, "abilities": {"str": 16, "dex": 16, "con": 12, "int": 8, "wis": 13, "cha": 10}, "saves": [], "immunities": "Charmed, Frightened", "senses": "Passive Perception 11", "languages": "Understands the languages you know", "traits": ["***Talented.*** Add half the spell's level (round down) to any ability check or saving throw the familiar makes.", "***Flyby (Flyer Only).*** The familiar doesn't provoke Opportunity Attacks when it flies out of an enemy's reach."], "actions": ["***Multiattack.*** The familiar makes a number of Rend attacks equal to half this spell's level (round down). The familiar can replace one of these attacks with Prowl if available.", "***Rend.*** *Melee Attack Roll:* Bonus equals your spell attack modifier, reach 5 ft. *Hit:* 1d8 + 3 + the spell's level Force damage.", "***Prowl (Stalker Only).*** The familiar moves up to half its Speed without provoking Opportunity Attacks. At the end of this movement, the familiar can take the Hide action."]}], "feats": [{"name": "Abjuration Adept", "source": "AU", "type": "General", "level": 4, "prerequisites": "Spellcasting or Pact Magic Feature", "text": ["You gain the following benefits.", "***Ability Score Increase.*** Increase your Intelligence, Wisdom, or Charisma by 1, to a maximum of 20.", "***Additional Spells.*** Your prowess allows you to always have certain spells at the ready. When you have spell slots of a level specified in the Abjuration Adept Spells table, you thereafter always have the spells listed for that level and lower prepared.", "***Protective Ward.*** When you cast a spell from the Abjuration school using a spell slot, you or one creature you can see within 30 feet of yourself gains Temporary Hit Points equal to twice the level of spell slot expended."], "tableName": "Abjuration Adept Spells", "table": [["Spell Slot Level", "Spell"], ["1", "Shield"], ["2", "Lesser Restoration"], ["3", "Protection from Energy"], ["4", "Banishment"], ["5", "Mass Cure Wounds"]]}]}</script>
<script>
(() => {
  "use strict";
  /* ===== DEFAULT CONFIG =====
     Where the default config comes from. On opening, the page uses the last config you imported or
     saved in this browser; if there isn't one, it loads DEFAULT_CONFIG_URL; if that fails, it uses
     the copy built into this page. "Revert to built-in config" in the editor follows the same order,
     minus the saved config.
     - A path next to this page:  "knacks.json"
     - A full web address:        "https://raw.githubusercontent.com/you/repo/main/knacks.json"
       (the server has to allow cross-site requests; GitHub raw and most static hosts do)
     - "" to always use the built-in copy. */
  const DEFAULT_CONFIG_URL = "https://zhangi-html.github.io/ranger-revised/config.json";
  const NODE_W = 176, NODE_H = 54, LANE_W = 190, COPIES = 3;
  const ROW_TOP = 38, ROW_BOTTOM = 22, STACK_GAP = 14, HEAD_H = 34;
  const STORE_KEY = "ranger-knacks-build", CONFIG_KEY = "ranger-knacks-config", SOURCE_KEY = "ranger-knacks-config-source";
  const DEFAULT_KNOWN = [1,3,4,5,5,7,8,8,10,10,11,11,11,13,14,14,14,14,14,14];
  // Lucide icons: mouse-left, mouse-right
  const ICON = {
    left: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.318V10"/><path d="M5 10v5a7 7 0 0 0 14 0V9c0-3.527-2.608-6.515-6-7"/><circle cx="7" cy="4" r="2"/></svg>',
    right: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.318V10"/><path d="M19 10v5a7 7 0 0 1-14 0V9c0-3.527 2.608-6.515 6-7"/><circle cx="17" cy="4" r="2"/></svg>'
  };
  const $ = (id) => document.getElementById(id);
  const hoverable = matchMedia("(hover: hover)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";

  let data, byId, tagByName, pillarByName, dependents, nodes = {};
  let spells = {}, items = {}, rules = {}, beasts = {}, feats = {};
  let level = 5, ranks = {}, clickedId = null, hovered = null, sheetOpen = false, zoom = 1, layout = null;
  let activeTags = new Set(), statusFilter = new Set();
  const STATUS_LABEL = { new: "New", updated: "Updated" };
  const undoStack = [], redoStack = [];

  /* ---------- data ---------- */
  const family = (name) => name.replace(/\s+(?:I|II|III|IV|V|VI|VII|VIII|IX|X)$/, "");
  function normalize(raw) {
    if (!raw || !Array.isArray(raw.knacks)) throw new Error("Expected an object with a \"knacks\" array.");
    const tags = (raw.tags || []).map(t => typeof t === "string" ? { name: t, color: "#6b6a58" } : { name: String(t.name), color: t.color || "#6b6a58" });
    const pillars = (raw.pillars || []).map(p => ({ name: String(p.name), color: p.color || "#6b6a58" }));
    const knacks = raw.knacks.map(k => ({
      id: String(k.id), name: k.name || String(k.id), level: Number(k.level) || 1,
      pillars: Array.isArray(k.pillars) && k.pillars.length ? k.pillars.map(String) : ["Other"],
      prereqs: Array.isArray(k.prereqs) ? k.prereqs.map(String) : [],
      maxRanks: k.maxRanks === null ? Infinity : (Number(k.maxRanks) || 1), status: k.status === "new" || k.status === "updated" ? k.status : (k.new ? "new" : ""),
      tags: Array.isArray(k.tags) ? k.tags.map(String) : [],
      prereqSkill: k.prereqSkill ? String(k.prereqSkill) : "",
      group: k.group ? String(k.group) : family(k.name || String(k.id)),
      text: Array.isArray(k.text) ? k.text : (k.text ? [String(k.text)] : []),
      oldText: Array.isArray(k.oldText) ? k.oldText : (k.oldText ? [String(k.oldText)] : []),
      clarifications: Array.isArray(k.clarifications) ? k.clarifications : (k.clarifications ? [String(k.clarifications)] : []),
      table: Array.isArray(k.table) ? k.table : null, tableName: k.tableName || ""
    }));
    const tagNames = new Set(tags.map(t => t.name)), pillarNames = new Set(pillars.map(p => p.name));
    knacks.forEach(k => {
      k.tags.forEach(tg => { if (!tagNames.has(tg)) { tags.push({ name: tg, color: "#6b6a58" }); tagNames.add(tg); } });
      k.pillars.forEach(p => { if (!pillarNames.has(p)) { pillars.push({ name: p, color: "#6b6a58" }); pillarNames.add(p); } });
    });
    const ids = new Set(knacks.map(k => k.id));
    knacks.forEach(k => {
      const missing = k.prereqs.filter(p => !ids.has(p));
      if (missing.length) console.warn(`${k.id}: unknown prerequisite(s) ${missing.join(", ")}`);
      k.prereqs = k.prereqs.filter(p => ids.has(p));
    });
    return { title: raw.title || "Ranger Knacks", knacksKnown: Array.isArray(raw.knacksKnown) && raw.knacksKnown.length >= 20 ? raw.knacksKnown : DEFAULT_KNOWN, pillars, tags, knacks };
  }
  function useSpells(raw) {
    const list = Array.isArray(raw) ? raw : raw && Array.isArray(raw.spells) ? raw.spells : null;
    if (!list) throw new Error("Expected an object with a \"spells\" array.");
    spells = Object.fromEntries(list.map(s => [String(s.name).toLowerCase(), s]));
    if (data) renderPanel();
  }
  function useData(d) {
    data = d;
    byId = Object.fromEntries(d.knacks.map(k => [k.id, k]));
    tagByName = Object.fromEntries(d.tags.map(t => [t.name, t]));
    pillarByName = Object.fromEntries(d.pillars.map(p => [p.name, p]));
    dependents = {};
    d.knacks.forEach(k => k.prereqs.forEach(p => (dependents[p] ||= []).push(k.id)));
    for (const id of Object.keys(ranks)) { if (!byId[id]) delete ranks[id]; else ranks[id] = Math.min(ranks[id], byId[id].maxRanks); }
    if (clickedId && !byId[clickedId]) clickedId = null;
    [...activeTags].forEach(t => { if (!tagByName[t]) activeTags.delete(t); });
    $("title").textContent = d.title; document.title = d.title;
    buildTags(); build(); render(); centerScroll();
  }
  // Two-pillar colours run in loop order: the pillar that comes first (wrapping around) sits on the left.
  function colors(pillarList) {
    const a = pillarList[0], b = pillarList[1];
    if (!b) { const c = pillarByName[a].color; return [c, c]; }
    const n = data.pillars.length, i = data.pillars.findIndex(p => p.name === a), j = data.pillars.findIndex(p => p.name === b);
    const aFirst = (j - i + n) % n === 1 ? true : (i - j + n) % n === 1 ? false : i < j;
    return aFirst ? [pillarByName[a].color, pillarByName[b].color] : [pillarByName[b].color, pillarByName[a].color];
  }
  const colorOf = (k) => pillarByName[k.pillars[0]].color;
  function paint(elm, pl) { const [a, b] = colors(pl); elm.style.setProperty("--c", a); elm.style.setProperty("--c2", b); }

  /* ---------- rules ---------- */
  const known = () => data.knacksKnown[level - 1] ?? 0;
  const spent = () => Object.values(ranks).reduce((a, b) => a + b, 0);
  const left = () => known() - spent();
  const rankOf = (id) => ranks[id] || 0;
  const missingPrereqs = (k) => k.prereqs.filter(p => !rankOf(p));
  const list = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  function learnPlan(k) {
    const r = rankOf(k.id);
    if (r >= k.maxRanks) return { ok: false, ids: [], why: k.maxRanks > 1 ? "Every rank of this Knack is learned." : "Already learned." };
    const ids = [], seen = new Set(), tooHigh = [];
    (function visit(id) {
      if (seen.has(id)) return; seen.add(id);
      const n = byId[id];
      if (id !== k.id && rankOf(id)) return;
      n.prereqs.forEach(visit);
      if (level < n.level) tooHigh.push(n);
      ids.push(id);
    })(k.id);
    if (tooHigh.length) {
      const top = tooHigh.reduce((a, b) => b.level > a.level ? b : a);
      return { ok: false, ids, why: top === k ? `Reach ranger level ${k.level} to learn this Knack.` : `Reach ranger level ${top.level} to learn ${top.name} first.` };
    }
    if (ids.length > left()) return { ok: false, ids, why: left() <= 0 ? `No Knacks left to choose at level ${level}.` : `Needs ${plural(ids.length, "Knack")}, and you have ${left()} left.` };
    return { ok: true, ids };
  }
  function forgetPlan(k) {
    const r = rankOf(k.id);
    if (!r) return { ok: false, ids: [] };
    if (r > 1) return { ok: true, ids: [k.id] };
    const ids = [], seen = new Set();
    (function visit(id) {
      if (seen.has(id)) return; seen.add(id); ids.push(id);
      (dependents[id] || []).filter(rankOf).forEach(visit);
    })(k.id);
    return { ok: true, ids };
  }
  const isInvalid = (k) => rankOf(k.id) > 0 && (level < k.level || missingPrereqs(k).length > 0);
  function state(k) {
    if (rankOf(k.id)) return "learned";
    if (level < k.level) return "locked";
    if (!missingPrereqs(k).length) return "available";
    return learnPlan(k).ids.every(id => byId[id].level <= level) ? "reachable" : "locked";
  }

  /* ---------- history ---------- */
  const snap = () => ({ level, ranks: { ...ranks } });
  function commit(fn) {
    const before = snap(); fn();
    if (JSON.stringify(before) === JSON.stringify(snap())) return;
    undoStack.push(before); if (undoStack.length > 200) undoStack.shift();
    redoStack.length = 0; render();
  }
  function restoreSnap(s) { level = s.level; ranks = { ...s.ranks }; render(); }
  function undo() { if (!undoStack.length) return; redoStack.push(snap()); restoreSnap(undoStack.pop()); toast("Undone"); }
  function redo() { if (!redoStack.length) return; undoStack.push(snap()); restoreSnap(redoStack.pop()); toast("Redone"); }

  /* ---------- actions ---------- */
  function learn(id) {
    const k = byId[id], p = learnPlan(k);
    if (!p.ok) { if (rankOf(id) < k.maxRanks) toast(p.why); renderPanel(); return; }
    commit(() => p.ids.forEach(i => ranks[i] = rankOf(i) + 1));
    if (p.ids.length > 1) toast(`Learned ${k.name} and ${plural(p.ids.length - 1, "prerequisite")}`);
  }
  function forget(id) {
    const k = byId[id], p = forgetPlan(k);
    if (!p.ok) return;
    commit(() => p.ids.forEach(i => { ranks[i] = rankOf(i) - 1; if (!ranks[i]) delete ranks[i]; }));
    if (p.ids.length > 1) toast(`Forgot ${k.name} and ${plural(p.ids.length - 1, "Knack")} that needed it`);
  }
  function setLevel(v) {
    const n = Math.max(1, Math.min(20, Math.round(Number(v)) || level));
    commit(() => { level = n; });
    $("lvInput").value = level;
  }
  function spotlight(id) {

  const autosizeAll = () => E("form").querySelectorAll("textarea").forEach(autosize);
  E("form").addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") autosize(e.target); });
  new MutationObserver(() => requestAnimationFrame(autosizeAll)).observe(E("form"), { childList: true });
  addEventListener("resize", () => { if (!document.getElementById("editor").hidden) autosizeAll(); });
  E("form").addEventListener("click", e => {
    const rc = e.target.closest("[data-goto]");
    if (rc) { flush(); const tb = KIND_TAB[rc.dataset.goto]; tab = tb; sel[tb] = rc.dataset.name; renderAll(); return; }
    const kl = e.target.closest("[data-edit]"); if (!kl) return;
    flush(); tab = "knacks"; sel.knacks = kl.dataset.edit; renderAll();
  });
  E("list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it && !it.classList.contains("missing-row")) sel.missing = null; }, true);
  function renderAll() {
    document.querySelector(".ed-main").classList.toggle("wide-preview", tab === "bestiary"); renderList(); renderForm(); renderPreview(); renderStatus(); }

  /* ---------- import / save ----------
     Import and Save use real files where the browser allows it (Chrome, Edge): Import remembers
     the file it opened, and Save writes back to it. Elsewhere Import reads a file and Save
     downloads one. Either way the tree switches to the imported or saved config. */
  const canPick = "showOpenFilePicker" in window && "showSaveFilePicker" in window;
  const PICKER = { types: [{ description: "Knack config", accept: { "application/json": [".json"] } }], excludeAcceptAllOption: false };
  const idb = (() => {
    let dbp = null;
    const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open("ranger-knacks", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
    return { get: (k) => tx("readonly", s => s.get(k)).catch(() => null), set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => null), del: (k) => tx("readwrite", s => s.delete(k)).catch(() => null) };
  })();
  function setTarget(handle, name) {
    fileHandle = handle || null; fileName = name || (handle && handle.name) || "";
    if (handle) idb.set("target", handle); else idb.del("target");
    try { localStorage.setItem("ranger-knacks-target-name", fileName); } catch (e) {}
    renderStatus();
  }
  function useImported(j, label) {
    if (!j || typeof j !== "object") throw new Error("That file isn't a config.");
    flush(); const before = snapshot();
    if (Array.isArray(j.knacks)) loadConfig({ ...j, spells: Array.isArray(j.spells) ? j.spells : exportSpells().spells, items: Array.isArray(j.items) ? j.items : exportItems(), rules: Array.isArray(j.rules) ? j.rules : exportRules(), bestiary: Array.isArray(j.bestiary) ? j.bestiary : exportBeasts(), feats: Array.isArray(j.feats) ? j.feats : exportFeats() });
    else if (Array.isArray(j.spells)) spells = normSpells(j.spells);   // an old spells-only file
    else throw new Error("It has no \"knacks\" or \"spells\" list.");
    if (before !== snapshot()) { undoStack.push(before); redoStack.length = 0; }
    T().apply(exportConfig(), label); savedSnapshot = snapshot();
    fixSelection(); ensureSelection(); renderAll(); afterChange();
    toast(`Imported ${label}. The tree now uses it.`);
  }
  async function importConfig() {
    if (!canPick) { E("fileInput").click(); return; }
    try {
      const [h] = await showOpenFilePicker(PICKER);
      const j = JSON.parse(await (await h.getFile()).text());
      useImported(j, h.name); setTarget(h);
    } catch (e) { if (e.name !== "AbortError") toast(`Couldn't import: ${e.message}`); }
  }
  async function importFile(f) {
    try { useImported(JSON.parse(await f.text()), f.name); setTarget(null, canPick ? "" : f.name); }
    catch (e) { toast(`Couldn't import ${f.name}: ${e.message}`); }
  }
  function confirmErrors() {
    const errors = doc.knacks.filter(k => worst(knackIssues(k)) === "error").length + spells.filter(s => worst(spellIssues(s)) === "error").length + items.filter(i => worst(itemIssues(i)) === "error").length + rules.filter(r => worst(ruleIssues(r)) === "error").length + beasts.filter(b => worst(beastIssues(b)) === "error").length + feats.filter(f => worst(featIssues(f)) === "error").length;
    return !errors || confirm(`${errors} item${errors === 1 ? " has" : "s have"} errors, marked ! in the list. Save anyway?`);
  }
  const fileText = () => JSON.stringify(exportConfig(), null, 2) + "\n";
  function finishSave(name) {
    flush(); T().apply(exportConfig(), name); savedSnapshot = snapshot(); renderStatus(); renderList();
    toast(`Saved to ${name}. The tree now uses it.`);
  }
  async function writeTo(handle) {
    if (handle.requestPermission && (await handle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("Permission to write the file was denied.");
    const w = await handle.createWritable(); await w.write(fileText()); await w.close();
  }
  function download(name) {
    const a = el("a", { href: URL.createObjectURL(new Blob([fileText()], { type: "application/json" })), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  async function saveAs() {
    closeMenu(); flush();
    if (!confirmErrors()) return;
    if (!canPick) { const name = fileName || "knacks.json"; download(name); setTarget(null, name); finishSave(name); return; }
    try {
      const h = await showSaveFilePicker({ ...PICKER, suggestedName: fileName || "knacks.json" });
      await writeTo(h); setTarget(h); finishSave(h.name);
    } catch (e) { if (e.name !== "AbortError") toast(`Couldn't save: ${e.message}`); }
  }
  async function saveConfig() {
    flush();
    if (!fileHandle) return saveAs();
    if (!confirmErrors()) return;
    try { await writeTo(fileHandle); finishSave(fileHandle.name); }
    catch (e) { toast(`Couldn't save to ${fileHandle.name}: ${e.message}`); }
  }
  async function revertToBuiltIn() {
    closeMenu();
    if (!confirm("Revert the tree and the editor to the default config? Undo brings your current edits back.")) return;
    const { cfg, source } = await T().defaultConfig();
    flush(); const before = snapshot();
    loadConfig(cfg);
    if (before !== snapshot()) { undoStack.push(before); redoStack.length = 0; }
    T().forget(); T().apply(exportConfig(), source); T().forget();
    savedSnapshot = snapshot(); setTarget(null, "");
    fixSelection(); ensureSelection(); renderAll(); afterChange();
    toast(`Reverted to the default config (${source})`);
  }

  /* ---------- menu ---------- */
  function openMenu() { E("menu").hidden = false; E("saveMenu").setAttribute("aria-expanded", "true"); E("saveAs").focus(); }
  function closeMenu() { E("menu").hidden = true; E("saveMenu").setAttribute("aria-expanded", "false"); }

  /* ---------- open / close ---------- */
  let lastFocus = null;
  function ensureSelection() {
    if (!sel.knacks || !knackById(sel.knacks)) sel.knacks = doc.knacks[0]?.id || null;
    if (!sel.spells || !spellByName(sel.spells)) sel.spells = spells[0]?.name || null;
    if (!sel.items || !itemByName(sel.items)) sel.items = items[0]?.name || null;
    if (!sel.rules || !ruleByName(sel.rules)) sel.rules = rules[0]?.name || null;
    if (!sel.bestiary || !beastByName(sel.bestiary)) sel.bestiary = beasts[0]?.name || null;
    if (!sel.feats || !featByName(sel.feats)) sel.feats = feats[0]?.name || null;
  }
  async function init() {
    if (ready) return;
    const applied = T().config();
    loadConfig(applied); savedSnapshot = snapshot();
    let draft = null; try { draft = localStorage.getItem(DRAFT_KEY); } catch (e) {}
    if (draft && draft !== savedSnapshot) {
      try { loadSnapshot(draft); undoStack.push(savedSnapshot); toast("Restored your unsaved edits. Undo goes back to the config the tree is using."); } catch (e) {}
    }
    try { fileName = localStorage.getItem("ranger-knacks-target-name") || ""; } catch (e) {}
    const h = await idb.get("target"); if (h) fileHandle = h; else if (canPick) fileName = "";
    ensureSelection(); ready = true;
  }
  async function open() {
    await init();
    lastFocus = document.activeElement;
    document.getElementById("editor").hidden = false;
    renderAll(); requestAnimationFrame(autosizeAll);
    E("close").focus();
  }
  function close() {
    flush(); closeMenu(); hideCard();
    document.getElementById("editor").hidden = true;
    lastFocus && lastFocus.focus && lastFocus.focus();
  }
  window.KnackEditor = { open, importFile: async (f) => { await init(); importFile(f); } };

  /* ---------- wiring ---------- */
  document.querySelectorAll("#editor .tabs button").forEach(b => b.onclick = () => { flush(); tab = b.dataset.tab; renderAll(); });
  E("search").addEventListener("input", e => { query = e.target.value; renderList(); });
  E("addBtn").onclick = () => tab === "spells" ? addSpell() : tab === "items" ? addItem() : tab === "rules" ? addRef("rule") : tab === "bestiary" ? addRef("bestiary") : tab === "feats" ? addRef("feat") : addKnack();
  E("undo").onclick = undo; E("redo").onclick = redo;
  E("import").onclick = importConfig;
  E("save").onclick = saveConfig;
  E("saveMenu").onclick = () => E("menu").hidden ? openMenu() : closeMenu();
  E("saveAs").onclick = saveAs;
  E("revert").onclick = revertToBuiltIn;
  E("close").onclick = close;
  E("fileInput").addEventListener("change", e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ""; });
  document.getElementById("editor").addEventListener("mousedown", e => { if (e.target.id === "editor") close(); });
  document.addEventListener("mousedown", e => { if (!E("menu").hidden && !e.target.closest(".split")) closeMenu(); });
  addEventListener("keydown", e => {
    if (document.getElementById("editor").hidden) return;
    const mod = e.ctrlKey || e.metaKey, inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === "Escape") { e.preventDefault(); if (!E("menu").hidden) { closeMenu(); E("saveMenu").focus(); } else close(); return; }
    if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); e.shiftKey ? saveAs() : saveConfig(); return; }
    if (inField) return;
    if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  });
  // Keep keyboard focus inside the dialog.
  document.getElementById("editor").addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const f = [...document.querySelectorAll("#editor button:not([disabled]), #editor input:not([disabled]):not([type=file]), #editor select, #editor textarea, #editor [tabindex]")].filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  });
  addEventListener("beforeunload", e => { if (ready && snapshot() !== savedSnapshot) { e.preventDefault(); e.returnValue = ""; } });
})();

</script>
</body>
</html>

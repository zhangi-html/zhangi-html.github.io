<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zhangi-html</title>
<style>
  :root {
    --bg: #141820;
    --panel: #1e2430;
    --accent: #6b8cae;
    --accent-bright: #8fb4d9;
    --text: #e4e8ef;
    --dim: #8a93a3;
    --border: #2f3848;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a2230 0%, var(--bg) 55%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    padding: 32px 20px 48px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .intro {
    margin: 0 0 28px;
    color: var(--dim);
    font-size: 0.95rem;
  }
  .purpose-tabs {
    display: flex;
    gap: 6px;
    margin: 0 0 16px;
    padding: 4px;
    background: rgba(30, 36, 48, 0.7);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .purpose-tab {
    flex: 1;
    padding: 9px 12px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .purpose-tab:hover,
  .purpose-tab.active {
    background: var(--accent);
    color: #fff;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }
  li a {
    display: block;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.15s;
  }
  li a:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .page-title {
    display: block;
    font-weight: 600;
    color: var(--accent-bright);
    margin-bottom: 4px;
  }
  .page-desc {
    display: block;
    font-size: 0.9rem;
    color: var(--dim);
  }
  footer {
    margin-top: 32px;
    font-size: 0.8rem;
    color: var(--dim);
  }
  footer a {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Published pages</h1>
  <p class="intro">Raw HTML I publish here and there.</p>
  <nav class="purpose-tabs" aria-label="Tools by purpose">
    <button class="purpose-tab active" type="button" data-purpose="dnd" aria-pressed="true">D&amp;D</button>
    <button class="purpose-tab" type="button" data-purpose="personal" aria-pressed="false">Personal Tools</button>
  </nav>
  <ul id="pages"></ul>
  <footer>
    <a href="https://github.com/zhangi-html/zhangi-html.github.io">Source on GitHub</a>
  </footer>
</main>
<script>
  const pages = [
    {
      href: 'dnd-stat-roller.html',
      title: 'Waterdeep Stat Rolls',
      description: 'Character creation tool for my Waterdeep campaign.',
      purpose: 'dnd'
    },
    {
      href: 'crafting-v2.html',
      title: 'Crafting XP v2',
      description: 'Experience and catch-up mechanics for D&D crafting trades.',
      purpose: 'dnd'
    },
    {
      href: 'floorplan/index.html',
      title: 'Interior Planning Tool',
      description: 'Build a measured room layout, place furniture, and model clearances.',
      purpose: 'personal'
    }
  ];

  const list = document.getElementById('pages');
  const renderPages = purpose => {
    list.replaceChildren();
    for (const page of pages.filter(item => item.purpose === purpose)) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      const title = document.createElement('span');
      const description = document.createElement('span');
      a.href = page.href;
      title.className = 'page-title';
      title.textContent = page.title;
      description.className = 'page-desc';
      description.textContent = page.description;
      a.append(title, description);
      li.appendChild(a);
      list.appendChild(li);
    }
  };

  document.querySelectorAll('.purpose-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.purpose-tab').forEach(item => {
        const active = item === tab;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      renderPages(tab.dataset.purpose);
    });
  });

  renderPages('dnd');
</script>
</body>
</html>
